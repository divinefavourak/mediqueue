# MediQueue -- LOCAL DEVELOPMENT DEFAULTS ONLY.
#
# This file is committed and ends up inside the packaged jar, so it must never contain a
# real password. Production configuration comes from environment variables, which override
# everything here:
#
#   db.url                     -> MEDIQUEUE_DB_URL      (or DATABASE_URL, platform style)
#   db.user                    -> MEDIQUEUE_DB_USER
#   db.password                -> MEDIQUEUE_DB_PASSWORD
#   server.port                -> MEDIQUEUE_SERVER_PORT (or PORT, platform style)
#   security.cookie.secure     -> MEDIQUEUE_SECURITY_COOKIE_SECURE
#   demo.seed                  -> MEDIQUEUE_DEMO_SEED
#   admin.email                -> MEDIQUEUE_ADMIN_EMAIL
#   admin.password             -> MEDIQUEUE_ADMIN_PASSWORD
#
# See DEPLOY.md.

server.port=8080

# Matches the local Docker container in the README. Not a secret: this database is only
# reachable from your own machine.
db.url=jdbc:postgresql://localhost:5432/mediqueue
db.user=postgres
db.password=postgres

# Applies schema.sql (and seed.sql on an empty database) at startup.
db.initialise=true

# Creates the three published demo accounts on an empty database.
#
# FALSE here, deliberately, even though this is the development file. This file is packaged
# INSIDE dist/mediqueue.jar, so whatever it says travels to every deployment -- a value of
# true would hand a published administrator password to anyone who forgot to override it.
# The artifact has to be safe on its own.
#
# run.bat and run.sh pass -Ddemo.seed=true, so local development still gets demo accounts.
demo.seed=false

# Marks the session cookie Secure, so browsers only send it over HTTPS. Off locally
# because development runs on http://localhost. Every deployment must set this to true.
security.cookie.secure=false

# PBKDF2 work factor. Higher is safer but slower to log in.
security.pbkdf2.iterations=120000
