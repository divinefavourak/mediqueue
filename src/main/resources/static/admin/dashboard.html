<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Overview — MediQueue</title>
    <link rel="icon" href="/img/mark.svg" type="image/svg+xml">
    <link rel="icon" href="/img/favicon-32.png" sizes="32x32">
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<main>
    <h1>Overview</h1>
    <p class="lede">How the health centre is running today.</p>

    <div id="notice" class="notice"></div>

    <div class="grid four">
        <section class="card stat"><span class="label">Booked today</span>
            <div class="n" id="statToday">—</div></section>
        <section class="card stat warn"><span class="label">Waiting now</span>
            <div class="n" id="statWaiting">—</div></section>
        <section class="card stat"><span class="label">Seen today</span>
            <div class="n" id="statAttended">—</div></section>
        <section class="card stat alt"><span class="label">Turned up</span>
            <div class="n" id="statRate">—</div></section>
    </div>

    <div class="grid three">
        <section class="card stat alt"><span class="label">Registered patients</span>
            <div class="n" id="statPatients">—</div></section>
        <section class="card stat alt"><span class="label">Staff accounts</span>
            <div class="n" id="statStaff">—</div></section>
        <section class="card stat alt"><span class="label">Departments</span>
            <div class="n" id="statDepartments">—</div></section>
    </div>
</main>

<script src="/js/api.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        const user = await requireUser(['ADMIN']);
        if (!user) return;

        renderRail(user, [
            { key: 'overview',    href: '/admin/dashboard.html',   label: 'Overview' },
            { key: 'queue',       href: '/staff/dashboard.html',   label: 'Queue board' },
            { key: 'departments', href: '/admin/departments.html', label: 'Departments' },
            { key: 'staff',       href: '/admin/staff.html',       label: 'Staff' },
            { key: 'reports',     href: '/admin/reports.html',     label: 'Reports' }
        ], 'overview');

        try {
            // Two independent reports, so one round trip of latency instead of two.
            const [totals, attendance] = await Promise.all([
                api('/api/reports/totals'),
                api('/api/reports/daily-attendance')
            ]);
            document.getElementById('statToday').textContent = totals.appointmentsToday;
            document.getElementById('statWaiting').textContent = totals.waitingNow;
            document.getElementById('statAttended').textContent = attendance.attended;
            document.getElementById('statRate').textContent = attendance.attendanceRate + '%';
            document.getElementById('statPatients').textContent = totals.patients;
            document.getElementById('statStaff').textContent = totals.staff;
            document.getElementById('statDepartments').textContent = totals.departments;
        } catch (error) {
            showNotice('notice', error.message);
        }
    });
</script>
</body>
</html>
