<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Departments — MediQueue</title>
    <link rel="icon" href="/img/mark.svg" type="image/svg+xml">
    <link rel="icon" href="/img/favicon-32.png" sizes="32x32">
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<main>
    <h1>Departments</h1>
    <p class="lede">Each department runs its own queue, with its own ticket numbers.</p>

    <div id="notice" class="notice"></div>

    <section class="card">
        <h2>Add a department</h2>
        <form id="departmentForm">
            <div class="row">
                <div>
                    <label class="label" for="name">Name</label>
                    <input type="text" id="name" name="name" required placeholder="Physiotherapy">
                </div>
                <div>
                    <label class="label" for="opensAt">Opens</label>
                    <input type="time" id="opensAt" name="opensAt" value="08:00" required>
                </div>
                <div>
                    <label class="label" for="closesAt">Closes</label>
                    <input type="time" id="closesAt" name="closesAt" value="16:00" required>
                </div>
                <div>
                    <label class="label" for="dailyCapacity">Patients a day</label>
                    <input type="number" id="dailyCapacity" name="dailyCapacity" value="40"
                           min="1" max="500" required>
                </div>
            </div>
            <button type="submit">Add department</button>
        </form>
    </section>

    <div class="card-head"><h2>All departments</h2></div>
    <div class="table-wrap">
        <table>
            <thead>
            <tr><th>Name</th><th>Hours</th><th>Capacity</th><th>Booking</th><th></th></tr>
            </thead>
            <tbody id="departmentRows">
            <tr><td colspan="5" class="empty">Loading…</td></tr>
            </tbody>
        </table>
    </div>
</main>

<script src="/js/api.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        const user = await requireUser(['ADMIN']);
        if (!user) return;

        renderRail(user, [
            { key: 'overview',    href: '/admin/dashboard.html',   label: 'Overview' },
            { key: 'queue',       href: '/staff/dashboard.html',   label: 'Queue board' },
            { key: 'departments', href: '/admin/departments.html', label: 'Departments' },
            { key: 'staff',       href: '/admin/staff.html',       label: 'Staff' },
            { key: 'reports',     href: '/admin/reports.html',     label: 'Reports' }
        ], 'departments');

        await loadDepartments();
    });

    async function loadDepartments() {
        const tbody = document.getElementById('departmentRows');
        try {
            const departments = await api('/api/departments');

            if (departments.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="empty">
                    No departments yet. Add one above and patients can start booking.
                </td></tr>`;
                return;
            }

            tbody.innerHTML = departments.map(d => `
                <tr>
                    <td><strong>${escapeHtml(d.name)}</strong></td>
                    <td>${escapeHtml(d.opensAt)}–${escapeHtml(d.closesAt)}</td>
                    <td>${escapeHtml(d.dailyCapacity)} a day</td>
                    <td><span class="badge ${d.active ? 'OPEN' : 'CLOSED'}">${d.active ? 'Open' : 'Closed'}</span></td>
                    <td>${d.active
                        ? `<button class="secondary tight" data-close="${escapeHtml(d.id)}">Close bookings</button>`
                        : '<span class="muted">—</span>'}</td>
                </tr>`).join('');

            document.querySelectorAll('[data-close]').forEach(button =>
                button.addEventListener('click', async () => {
                    if (!confirm('Stop accepting new appointments for this department?')) return;
                    button.disabled = true;
                    try {
                        // Deactivates rather than deletes: appointment history and the
                        // reports still reference this department.
                        const result = await api(`/api/departments/${button.dataset.close}`,
                            { method: 'DELETE' });
                        showNotice('notice', result.message, 'success');
                        await loadDepartments();
                    } catch (error) {
                        showNotice('notice', error.message);
                        button.disabled = false;
                    }
                }));
        } catch (error) {
            showNotice('notice', error.message);
            tbody.innerHTML = '<tr><td colspan="5" class="empty">Could not load departments.</td></tr>';
        }
    }

    onSubmit('departmentForm', 'notice', async values => {
        await api('/api/departments', { method: 'POST', body: values });
        showNotice('notice', `${values.name} added. Patients can book it now.`, 'success');
        document.getElementById('departmentForm').reset();
        await loadDepartments();
    });
</script>
</body>
</html>
