<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="MediQueue">
  <title>MediQueue</title>
  <!--
    A queue ticket bearing the number 1, which is the state the product exists to reach:
    you are next.

    Deliberately not a cross, a clock or a calendar. Those read as "some medical app" and
    say nothing about queueing, which is the whole point of this one.

    The numeral is geometry rather than SVG <text>, so it renders identically with no
    webfont loaded, which is the situation a favicon is always in.

    Note: SVG is XML, so a double hyphen is illegal inside these comments. It makes the
    file malformed and browsers show a broken image with no error at all.
  -->
  <rect x="2" y="2" width="28" height="28" rx="4" fill="#0D2137"/>

  <!-- The digit 1: stem, base bar, and the flag stroked rather than outlined. -->
  <g fill="#70DB9D">
    <rect x="13.9" y="6.2" width="4.5" height="15.7"/>
    <rect x="8.9" y="21.9" width="14.4" height="3.7"/>
  </g>
  <path d="M15.3 8.1 L10.3 11.6" stroke="#70DB9D" stroke-width="3.7" fill="none"/>

  <!-- A tear notch on each side, so the tile reads as a ticket rather than a keycap. -->
  <circle cx="2" cy="16" r="2.6" fill="#F9F9F9"/>
  <circle cx="30" cy="16" r="2.6" fill="#F9F9F9"/>
</svg>
