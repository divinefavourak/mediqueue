<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My queue — MediQueue</title>
    <link rel="icon" href="/img/mark.svg" type="image/svg+xml">
    <link rel="icon" href="/img/favicon-32.png" sizes="32x32">
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<main>
    <h1 id="greeting">My queue</h1>
    <p class="muted" id="whereWhen">—</p>

    <div id="notice" class="notice"></div>

    <!-- Live status. Position is the hero; the ticket number is reference. -->
    <section id="livePosition" class="card status" hidden aria-live="polite">
        <span class="label position-label">Your position</span>
        <div class="position" id="positionNumber">—</div>

        <!-- The queue as marks, so "3 ahead" registers without being read. -->
        <div class="pips" id="pips" role="img" aria-label="Queue position"></div>

        <p class="status-say" id="positionSummary">Checking the queue…</p>

        <div class="estimate" id="estimate" hidden>
            <span id="estimateText"></span>
            <span class="hedge">based on today’s pace</span>
        </div>

        <div class="status-split">
            <div>
                <span class="label">Your ticket</span>
                <div class="v" id="ticketNumber">—</div>
            </div>
            <div>
                <span class="label">Now serving</span>
                <div class="v" id="nowServing">—</div>
            </div>
        </div>

        <p class="hint" id="lastChecked"></p>
    </section>

    <!-- Shown instead once the visit is over. -->
    <section id="verdictBoard" class="card status" hidden>
        <span class="label position-label" id="verdictWhen">—</span>
        <p class="status-say" id="verdictStamp" style="font-size:1.6rem;margin:.5rem 0"></p>
        <p class="muted" id="verdictSay"></p>
    </section>

    <section class="card">
        <div class="card-head">
            <h2>Your appointments</h2>
            <a class="btn tight" href="/patient/book.html">Book</a>
        </div>
        <!-- Cards, not a table: a phone cannot show five columns without sideways
             scrolling, and status plus cancel are the two things a patient came for. -->
        <div class="appt-list" id="appointmentRows">
            <p class="empty">Loading…</p>
        </div>
    </section>
</main>

<script src="/js/api.js"></script>
<script src="/js/patient.js"></script>
</body>
</html>
