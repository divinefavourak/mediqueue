<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create an account — MediQueue</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="centred">
<main>
    <a class="wordmark" href="/" style="display:inline-block;margin-bottom:1.25rem">MediQueue</a>

    <section class="sheet">
        <h1 style="font-size:1.5rem">Create your account</h1>
        <p class="muted">Register once, then book whenever you need to.</p>

        <div id="notice" class="notice"></div>

        <form id="registerForm">
            <label for="fullName">Full name</label>
            <input type="text" id="fullName" name="fullName" required autocomplete="name"
                   placeholder="Chidi Okafor">

            <label for="email">Email address</label>
            <input type="email" id="email" name="email" required autocomplete="email"
                   placeholder="you@example.com">

            <label for="phone">Phone number <span style="letter-spacing:0;text-transform:none">(optional)</span></label>
            <input type="tel" id="phone" name="phone" autocomplete="tel" placeholder="0803 000 0000">

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required minlength="8"
                   autocomplete="new-password">
            <p class="hint">At least 8 characters. Length matters more than symbols.</p>

            <button type="submit">Create account</button>
        </form>

        <hr class="perf">
        <p class="muted" style="margin:0">
            Already registered? <a href="/login.html">Sign in</a>
        </p>
    </section>
</main>

<script src="/js/api.js"></script>
<script>
    onSubmit('registerForm', 'notice', async values => {
        await api('/api/auth/register', { method: 'POST', body: values });
        // Registering signs the patient in, so send them to booking rather than asking
        // for the password they just chose.
        window.location.href = '/patient/book.html';
    });
</script>
</body>
</html>
