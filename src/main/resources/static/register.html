<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create an account — MediQueue</title>
    <link rel="icon" href="/img/mark.svg" type="image/svg+xml">
    <link rel="icon" href="/img/favicon-32.png" sizes="32x32">
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="centred">
<main>
    <a class="wordmark" href="/" style="margin-bottom:1.25rem">
        <img src="/img/mark.svg" alt="" width="26" height="26">MediQueue</a>

    <section class="card">
        <h1>Create your account</h1>
        <p class="muted">Register once, then book whenever you need to.</p>

        <div id="notice" class="notice"></div>

        <form id="registerForm">
            <label class="label" for="fullName">Full name</label>
            <input type="text" id="fullName" name="fullName" required autocomplete="name"
                   placeholder="Chidi Okafor">

            <label class="label" for="email">Email address</label>
            <input type="email" id="email" name="email" required autocomplete="email"
                   placeholder="you@example.com">

            <label class="label" for="phone">Phone number (optional)</label>
            <input type="tel" id="phone" name="phone" autocomplete="tel" placeholder="0803 000 0000">

            <label class="label" for="password">Password</label>
            <input type="password" id="password" name="password" required minlength="8"
                   autocomplete="new-password">
            <p class="hint">At least 8 characters. Length matters more than symbols.</p>

            <button type="submit">Create account</button>
        </form>

        <p class="muted" style="margin-top:1.25rem">
            Already registered? <a href="/login.html">Sign in</a>
        </p>
    </section>
</main>
<script src="/js/api.js"></script>
<script>
    onSubmit('registerForm', 'notice', async values => {
        await api('/api/auth/register', { method: 'POST', body: values });
        // Registering signs the patient in, so send them to booking rather than to an
        // empty dashboard.
        window.location.href = '/patient/book.html';
    });
</script>
</body>
</html>
