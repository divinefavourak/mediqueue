<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Queue board — MediQueue</title>
    <link rel="icon" href="/img/mark.svg" type="image/svg+xml">
    <link rel="icon" href="/img/favicon-32.png" sizes="32x32">
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<main>
    <div class="card-head">
        <div>
            <h1 id="deptName">Queue board</h1>
            <div class="chips">
                <span class="chip on" id="chipWaiting">— waiting</span>
                <span class="chip" id="chipSeen">— seen today</span>
            </div>
        </div>
        <button class="tight" id="callNext" style="min-height:48px">Call next patient</button>
    </div>

    <div id="notice" class="notice"></div>

    <!-- The patient in the room, with their actions attached. A nurse acts on whoever is
         in front of them; making them find a row first is a step that serves nobody. -->
    <section class="card serving" id="servingCard">
        <div>
            <span class="label">Now serving</span>
            <div class="serving-no" id="servingNo">—</div>
            <div class="serving-who" id="servingWho">Nobody called yet</div>
        </div>
        <div class="serving-actions" id="servingActions" hidden>
            <button class="tight" id="servingSeen">Mark as seen</button>
            <button class="critical tight" id="servingAbsent">Mark as absent</button>
        </div>
    </section>

    <section class="card">
        <div class="row">
            <div>
                <label class="label" for="departmentId">Department</label>
                <select id="departmentId"><option value="">Loading…</option></select>
            </div>
            <div>
                <label class="label" for="date">Date</label>
                <input type="date" id="date">
            </div>
        </div>
    </section>

    <div class="card-head">
        <h2>Register</h2>
        <span class="muted" id="registerCount"></span>
    </div>
    <div class="table-wrap">
        <table>
            <thead>
            <tr><th>Ticket</th><th>Patient</th><th>Phone</th><th>Status</th><th>Record</th></tr>
            </thead>
            <tbody id="queueRows">
            <tr><td colspan="5" class="empty">Loading…</td></tr>
            </tbody>
        </table>
    </div>
</main>

<script src="/js/api.js"></script>
<script src="/js/staff.js"></script>
</body>
</html>
